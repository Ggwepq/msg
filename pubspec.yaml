name: key_msg
description: "A key-based private messaging Flutter app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2
  video_player: ^2.8.6
  video_compress: ^3.1.2
  firebase_core: ^3.12.0
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  flutter_dotenv: ^5.2.1
  flutter_local_notifications: ^17.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/img/msg-icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/img/msg-icon.png"
  windows:
    generate: true
    image_path: "assets/img/msg-icon.png"
  macos:
    generate: true
    image_path: "assets/img/msg-icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/img/msg-icon.png
    - .env

